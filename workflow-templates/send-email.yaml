# Set up several variables on repository level
#   - EMAIL_SMTP_HOST (smtp.gmail.com)
#   - EMAIL_SMTP_PORT (587)
#   - EMAIL_FROM (user@example.com)

# Set up secret on repository level
#   - EMAIL_PASSWORD

name: Send E-mail

on:
  workflow_dispatch:
    inputs:
      recipient:
        description: E-mail recipient
        required: true
        type: string
      subject:
        description: E-mail subject
        required: false
        type: string
        default: ""
      body:
        description: E-mail body
        required: false
        type: string
permissions:
  contents: read
jobs:
  send-email:
    name: Test — env var fallback
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Send email
        uses: netcracker/qubership-workflow-hub/actions/email-action@main
        env:
          EMAIL_SMTP_HOST: ${{ vars.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ vars.EMAIL_SMTP_PORT }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_USERNAME: ${{ vars.EMAIL_FROM }}
        with:
          to: ${{ inputs.recipient }}
          subject: ${{ inputs.subject }}
          body: ${{ inputs.body }}
